<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%" style="background: #060919; border-radius: 14px; border: 1px solid #1e293b; font-family: 'Fira Code', 'Courier New', monospace;">
  <defs>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineType1 {
      0%, 10% { opacity: 0; transform: translateX(-8px); }
      15%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes lineType2 {
      0%, 28% { opacity: 0; transform: translateX(-8px); }
      35%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes lineType3 {
      0%, 50% { opacity: 0; transform: translateX(-8px); }
      58%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes lineType4 {
      0%, 72% { opacity: 0; transform: translateX(-8px); }
      80%, 100% { opacity: 1; transform: translateX(0); }
    }
    .term-cursor { animation: cursorBlink 0.9s infinite; }
    .t-line1 { animation: lineType1 8s ease-out infinite; }
    .t-line2 { animation: lineType2 8s ease-out infinite; }
    .t-line3 { animation: lineType3 8s ease-out infinite; }
    .t-line4 { animation: lineType4 8s ease-out infinite; }
  </style>
  <!-- Window Header -->
  <rect x="0" y="0" width="900" height="36" rx="14" fill="url(#termHeader)" />
  <rect x="0" y="22" width="900" height="14" fill="#0f172a" />
  <circle cx="22" cy="18" r="6" fill="#ef4444" />
  <circle cx="42" cy="18" r="6" fill="#f59e0b" />
  <circle cx="62" cy="18" r="6" fill="#10b981" />
  <text x="450" y="23" fill="#94a3b8" font-size="12" text-anchor="middle" font-weight="600" letter-spacing="1">
    cosmic-terminal@deepspace-node:~
  </text>
  <!-- Body text -->
  <g transform="translate(28, 70)" font-size="14" font-weight="500">
    <!-- Line 1 -->
    <g class="t-line1">
      <text x="0" y="0" fill="#38bdf8">❯ SYSTEM.IDENTITY</text>
      <text x="175" y="0" fill="#e2e8f0">: Full-Stack Cosmic Architect &amp; Software Engineer</text>
    </g>
    <!-- Line 2 -->
    <g class="t-line2" transform="translate(0, 32)">
      <text x="0" y="0" fill="#f472b6">❯ ACTIVE.MISSION</text>
      <text x="175" y="0" fill="#e2e8f0">: Architecting high-performance distributed systems &amp; intelligent tools</text>
    </g>
    <!-- Line 3 -->
    <g class="t-line3" transform="translate(0, 64)">
      <text x="0" y="0" fill="#facc15">❯ CELESTIAL.TECH</text>
      <text x="175" y="0" fill="#e2e8f0">: TypeScript • Python • Rust • React • Next.js • Cloud Native</text>
    </g>
    <!-- Line 4 -->
    <g class="t-line4" transform="translate(0, 96)">
      <text x="0" y="0" fill="#4ade80">❯ ORBITAL.STATUS</text>
      <text x="175" y="0" fill="#38bdf8">: ⚡ 100% OPERATIONAL // AVAILABLE FOR STELLAR COLLABORATIONS</text>
      <rect x="700" y="-12" width="9" height="16" fill="#38bdf8" class="term-cursor" />
    </g>
  </g>
</svg>
